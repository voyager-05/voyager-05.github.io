<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AI Pharmie</title>
  <style>
    html, body { width:100%; height:100%; margin:0; }
    body{
      font-family:system-ui;
      background:#000;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start; /* <-- top, not center */
      padding-top:16px;
    }
    #controls{
      position:relative;
      z-index:10;               /* <-- stay above iframe */
      margin-bottom:14px;
      text-align:center;
    }
    #controls button{
      padding:8px 14px;
      margin:4px;
      cursor:pointer;
    }
    #container{
      width:1300px;
      height:780px;
      background:#0f0f0f;
      box-shadow:0 8px 24px rgba(0,0,0,0.25);
      position:relative;
      z-index:1;
    }
    iframe{ width:100%; height:100%; border:0; display:block; }
  </style>
</head>
<body>

  <div id="controls">
    <button onclick="loadUnity('A')">Socratic Method</button>
    <button onclick="loadUnity('B')">Adaptive Mastery</button>
    <button onclick="loadUnity('C')">Retrieval Practise</button>
    <button onclick="unloadUnity()">Unload</button>
  </div>

  <div id="container">
    <iframe id="frame" src="/pharmie-ai-socratic/" title="AI Pharmie" allow="autoplay; fullscreen"></iframe>
  </div>

  <script>
    const URLS = {
      A: "/pharmie-ai-socratic/",
      B: "/pharmie-ai-adaptive-mastery/",
      C: "/pharmie-ai-retrieval-practise/"
    };
    const frame = document.getElementById("frame");
    function loadUnity(key){ frame.src = URLS[key]; }
    function unloadUnity(){ frame.src = "about:blank"; }
  </script>

</body>
</html>
