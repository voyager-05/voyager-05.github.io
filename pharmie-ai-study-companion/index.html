<div id="stage">
  <div id="container">
    <iframe id="frame" src="/pharmie-ai-socratic/" title="AI Pharmie" allow="autoplay; fullscreen"></iframe>
  </div>
</div>

<style>
  #stage{
    width:100%;
    display:flex;
    justify-content:center;
  }

  /* The “native” size you want */
  #container{
    width:1280px;
    height:720px;
    background:#0f0f0f;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
    transform-origin: top center;
  }

  #container iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#000;
  }
</style>

<script>
  function fit1280x720() {
    const controls = document.getElementById("controls");
    const controlsH = controls ? controls.getBoundingClientRect().height : 0;

    const availW = window.innerWidth - 32;               // padding budget
    const availH = window.innerHeight - controlsH - 32;  // padding budget

    const s = Math.min(availW / 1280, availH / 720, 1);  // only shrink, never enlarge
    document.getElementById("container").style.transform = `scale(${s})`;
  }

  window.addEventListener("resize", fit1280x720);
  window.addEventListener("load", fit1280x720);
</script>
