<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Pharmie</title>

  <style>
    html, body { width:100%; height:100%; margin:0; }

    body{
      font-family:system-ui;
      background:#000;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding-top:16px;
      box-sizing:border-box;
      overflow:hidden; /* prevent outer page scrollbars */
    }

    #controls{
      position:relative;
      z-index:10;
      margin-bottom:14px;
      text-align:center;
    }

    #controls button{
      padding:8px 14px;
      margin:4px;
      cursor:pointer;
    }

    /* Height is computed from real controls height (works at any DPI/zoom) */
    #container{
      height: var(--availH, 70vh);
      aspect-ratio: 16 / 9;

      max-width: 1300px;
      width: auto;

      background:#0f0f0f;
      box-shadow:0 8px 24px rgba(0,0,0,0.25);
      position:relative;
      z-index:1;
      overflow:hidden; /* clip anything that escapes */
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#000;
      overflow:hidden;
    }
  </style>
</head>

<body>

  <div id="controls">
    <button onclick="loadUnity('A')">Socratic Method</button>
    <button onclick="loadUnity('B')">Adaptive Mastery</button>
    <button onclick="loadUnity('C')">Retrieval Practise</button>
    <button onclick="unloadUnity()">Unload</button>
  </div>

  <div id="container">
    <iframe
      id="frame"
      src="/pharmie-ai-socratic/"
      title="AI Pharmie"
      allow="autoplay; fullscreen"
      allowfullscreen
      scrolling="no">
    </iframe>
  </div>

  <script>
    const URLS = {
      A: "/pharmie-ai-socratic/",
      B: "/pharmie-ai-adaptive-mastery/",
      C: "/pharmie-ai-retrieval-practise/"
    };

    const frame = document.getElementById("frame");
    const controls = document.getElementById("controls");
    const container = document.getElementById("container");

    function loadUnity(key){
      frame.src = URLS[key];
    }

    function unloadUnity(){
      frame.src = "about:blank";
    }

    // Make container always use the remaining visible height (handles 125/150/200% scaling)
    function layout() {
      const vv = window.visualViewport;
      const viewportH = vv ? vv.height : window.innerHeight;

      const controlsH = controls.getBoundingClientRect().height;
      const bodyTopPadding = 16;
      const controlsMarginBottom = 14;
      const safety = 12;

      const availH = Math.max(
        240,
        viewportH - bodyTopPadding - controlsH - controlsMarginBottom - safety
      );

      container.style.setProperty("--availH", `${availH}px`);
    }

    // Patch the Unity page INSIDE the iframe so it fits and stops creating scrollbars
    function patchIframeContent() {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc) return;

        // Inject CSS to force the Unity canvas/page to fit the iframe
        const style = doc.createElement("style");
        style.textContent = `
          html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            background: #000 !important;
          }
          canvas {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
          }
          /* common Unity wrappers */
          #unity-container, #unity-canvas, #unity-build, .unity-desktop, .webgl-content {
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
          }
        `;
        doc.head.appendChild(style);
      } catch (e) {
        // If any build ends up cross-origin, this will fail safely.
      }
    }

    frame.addEventListener("load", () => {
      layout();
      patchIframeContent();
      // run again shortly after Unity scripts apply inline sizes
      setTimeout(patchIframeContent, 250);
      setTimeout(patchIframeContent, 1000);
    });

    window.addEventListener("resize", layout);
    window.addEventListener("load", layout);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", layout);
    new ResizeObserver(layout).observe(controls);

    layout();
  </script>

</body>
</html>
