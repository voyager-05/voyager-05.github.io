<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AI Pharmie</title>
  <style>
    html, body { height:100%; margin:0; background:#000; }
    body { font-family: system-ui; }

    #controls{
      padding:16px;
      text-align:center;
    }
    #controls button{
      padding:8px 14px;
      margin:4px;
      cursor:pointer;
    }

    /* itch-style: responsive player area with aspect ratio */
    .player{
      width: min(1280px, 100vw);
      aspect-ratio: 16 / 9;
      margin: 0 auto 16px;
      background:#111;
      box-shadow:0 8px 24px rgba(0,0,0,0.25);
      border-radius: 8px;
      overflow:hidden; /* keeps it clean like itch */
    }

    .player iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#000;
    }

    /* If viewport is short, constrain height and let width follow */
    @media (max-height: 820px){
      .player{
        height: calc(100vh - 120px);
        width: auto;
        aspect-ratio: 16 / 9;
      }
    }
  </style>
</head>
<body>

  <div id="controls">
    <button onclick="loadUnity('A')">Socratic Method</button>
    <button onclick="loadUnity('B')">Adaptive Mastery</button>
    <button onclick="loadUnity('C')">Retrieval Practise</button>
    <button onclick="unloadUnity()">Unload</button>
  </div>

  <div class="player">
    <iframe id="frame" src="/pharmie-ai-socratic/" allow="autoplay; fullscreen"></iframe>
  </div>

  <script>
    const URLS = {
      A: "/pharmie-ai-socratic/",
      B: "/pharmie-ai-adaptive-mastery/",
      C: "/pharmie-ai-retrieval-practise/"
    };
    const frame = document.getElementById("frame");
    function loadUnity(key){ frame.src = URLS[key]; }
    function unloadUnity(){ frame.src = "about:blank"; }
  </script>

</body>
</html>
