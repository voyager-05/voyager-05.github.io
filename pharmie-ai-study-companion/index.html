<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AI Pharmie</title>
  <style>
    html, body { width:100%; height:100%; margin:0; }

    body{
      font-family:system-ui;
      background:#000;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding:16px;
      box-sizing:border-box;
    }

    #controls{
      z-index:10;
      margin-bottom:14px;
      text-align:center;
    }
    #controls button{
      padding:8px 14px;
      margin:4px;
      cursor:pointer;
    }

    /* Always fit: constrained by viewport AND 16:9 */
    #container{
      --gap: 32px;        /* body padding total left+right (16+16) */
      --topUI: 110px;     /* controls + margins + padding (tweak if needed) */

      aspect-ratio: 16 / 9;

      /* Width must fit:
         1) max design width (1300)
         2) viewport width minus padding
         3) viewport height (minus UI) converted to 16:9 width
      */
      width: min(
        1300px,
        calc(100vw - var(--gap)),
        calc((100vh - var(--topUI)) * 16 / 9)
      );

      background:#0f0f0f;
      box-shadow:0 8px 24px rgba(0,0,0,0.25);
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#000;
    }
  </style>
</head>
<body>

  <div id="controls">
    <button onclick="loadUnity('A')">Socratic Method</button>
    <button onclick="loadUnity('B')">Adaptive Mastery</button>
    <button onclick="loadUnity('C')">Retrieval Practise</button>
    <button onclick="unloadUnity()">Unload</button>
  </div>

  <div id="container">
    <iframe id="frame" src="/pharmie-ai-socratic/" title="AI Pharmie" allow="autoplay; fullscreen"></iframe>
  </div>

  <script>
    const URLS = {
      A: "/pharmie-ai-socratic/",
      B: "/pharmie-ai-adaptive-mastery/",
      C: "/pharmie-ai-retrieval-practise/"
    };
    const frame = document.getElementById("frame");
    function loadUnity(key){ frame.src = URLS[key]; }
    function unloadUnity(){ frame.src = "about:blank"; }
  </script>

</body>
</html>
