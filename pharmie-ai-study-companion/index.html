<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Pharmie</title>
  <style>
    html, body { width:100%; height:100%; margin:0; }

    body{
      font-family:system-ui;
      background:#000;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding-top:16px;
      box-sizing:border-box;
    }

    #controls{
      position:relative;
      z-index:10;
      margin-bottom:14px;
      text-align:center;
    }

    #controls button{
      padding:8px 14px;
      margin:4px;
      cursor:pointer;
    }

    /* responsive 16:9 container; height is set by JS via --availH */
    #container{
      height: var(--availH, 70vh);
      aspect-ratio: 16 / 9;

      max-width: 1300px;
      width: auto; /* width derived from height because of aspect-ratio */

      background:#0f0f0f;
      box-shadow:0 8px 24px rgba(0,0,0,0.25);
      position:relative;
      z-index:1;
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#000;
    }
  </style>
</head>
<body>

  <div id="controls">
    <button onclick="loadUnity('A')">Socratic Method</button>
    <button onclick="loadUnity('B')">Adaptive Mastery</button>
    <button onclick="loadUnity('C')">Retrieval Practise</button>
    <button onclick="unloadUnity()">Unload</button>
  </div>

  <div id="container">
    <iframe
      id="frame"
      src="/pharmie-ai-socratic/"
      title="AI Pharmie"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    const URLS = {
      A: "/pharmie-ai-socratic/",
      B: "/pharmie-ai-adaptive-mastery/",
      C: "/pharmie-ai-retrieval-practise/"
    };

    const frame = document.getElementById("frame");
    const controls = document.getElementById("controls");
    const container = document.getElementById("container");

    function loadUnity(key){ frame.src = URLS[key]; }
    function unloadUnity(){ frame.src = "about:blank"; }

    function layout() {
      // Use visualViewport when available (best under zoom/mobile)
      const vv = window.visualViewport;
      const viewportH = vv ? vv.height : window.innerHeight;

      const controlsH = controls.getBoundingClientRect().height;
      const bodyTopPadding = 16;
      const controlsMarginBottom = 14;
      const safety = 12; // small buffer to avoid overflow at odd zoom levels

      const availH = Math.max(
        240, // minimum usable height
        viewportH - bodyTopPadding - controlsH - controlsMarginBottom - safety
      );

      container.style.setProperty("--availH", `${availH}px`);
    }

    window.addEventListener("resize", layout);
    window.addEventListener("load", layout);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", layout);

    // Re-run after buttons wrap onto a second line at higher scaling
    new ResizeObserver(layout).observe(controls);

    layout();
  </script>

</body>
</html>
