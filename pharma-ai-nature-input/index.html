<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | _source</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">_source</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/NatureInput_WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/NatureInput_WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/NatureInput_WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/NatureInput_WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "_source",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

		var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
					   (navigator.maxTouchPoints > 0 && window.screen.width <= 1024);

		if (isMobile) {
		  // Viewport meta
		  var meta = document.createElement('meta');
		  meta.name = 'viewport';
		  meta.content = 'width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover';
		  document.getElementsByTagName('head')[0].appendChild(meta);

		  // Kill all margins/overflow on html and body
		  document.documentElement.style.cssText = 'margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;';
		  document.body.style.cssText            = 'margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;';

		  // Size the container and canvas to fill screen
		  var container = document.querySelector("#unity-container");
		  container.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;';

		  canvas.style.setProperty('position', 'fixed',   'important');
		  canvas.style.setProperty('top',      '0',        'important');
		  canvas.style.setProperty('left',     '0',        'important');
		  canvas.style.setProperty('width',    '100vw',    'important');
		  canvas.style.setProperty('height',   '100dvh',   'important'); // dvh avoids iOS address bar gap

		  // Remove the hardcoded HTML attributes — these set the render buffer size
		  // and override CSS if left in place
		  canvas.removeAttribute('width');
		  canvas.removeAttribute('height');

		  // Hide the footer/fullscreen button on mobile — not needed
		  var footer = document.querySelector("#unity-footer");
		  if (footer) footer.style.display = 'none';

		  // Portrait lock (Android Chrome only)
		  if (screen.orientation && screen.orientation.lock) {
			screen.orientation.lock('portrait').catch(function(){});
		  }

		  // Landscape rotate overlay
		  var overlay = document.createElement('div');
		  overlay.style.cssText = 'display:none;position:fixed;inset:0;background:#111;color:#fff;' +
			'font-size:18px;font-family:sans-serif;align-items:center;justify-content:center;' +
			'flex-direction:column;text-align:center;z-index:99999;padding:2rem;';
		  overlay.innerHTML = '<div style="font-size:48px;margin-bottom:1rem">&#8635;</div>' +
							  '<div>Please rotate your device to portrait mode</div>';
		  document.body.appendChild(overlay);

		  function checkOrientation() {
			var isLandscape = window.innerWidth > window.innerHeight;
			overlay.style.display = isLandscape ? 'flex' : 'none';
		  }
		  window.addEventListener('resize', checkOrientation);
		  window.addEventListener('orientationchange', checkOrientation);
		  checkOrientation();

		} else {
		  // Desktop — keep existing behaviour
		  canvas.style.width  = "960px";
		  canvas.style.height = "600px";
		}

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
