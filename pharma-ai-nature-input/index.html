<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | _source</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* ── Desktop layout ── */
      #unity-container.unity-desktop {
        position: relative;
        width: 960px;
        height: 600px;
        margin: 0 auto;
      }

      /* ── Mobile layout ── */
      #unity-container.unity-mobile {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #000;
      }

      /* Loading bar */
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        text-align: center;
      }

      #unity-logo {
        width: 154px;
        height: 130px;
        background: url('TemplateData/unity-logo-dark.png') no-repeat center;
      }

      #unity-progress-bar-empty {
        width: 141px;
        height: 18px;
        margin-top: 10px;
        background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center;
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 18px;
        background: url('TemplateData/progress-bar-full-dark.png') no-repeat center;
      }

      #unity-footer {
        position: relative;
      }

      .unity-mobile #unity-footer {
        display: none;
      }

      #unity-fullscreen-button {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 38px;
        height: 38px;
        background: url('TemplateData/fullscreen-button.png') no-repeat center;
        cursor: pointer;
      }

      #unity-warning {
        position: absolute;
        left: 50%;
        top: 5%;
        transform: translate(-50%);
        background: white;
        padding: 10px;
        display: none;
        z-index: 100;
      }

      /* Rotate overlay (mobile landscape) */
      #sdm-rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: #111;
        color: #fff;
        font-size: 18px;
        font-family: sans-serif;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        z-index: 99999;
        padding: 2rem;
      }

      #sdm-rotate-overlay .rotate-icon {
        font-size: 56px;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>

    <!-- Rotate-to-portrait overlay (mobile only) -->
    <div id="sdm-rotate-overlay">
      <div class="rotate-icon">&#8635;</div>
      <div>Please rotate your device to portrait mode</div>
    </div>

    <div id="unity-container" class="unity-desktop">
      <!-- No hardcoded width/height attributes — CSS handles sizing -->
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">_source</div>
      </div>
    </div>

    <script>
      // ── Device detection ──────────────────────────────────────────────────
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                     (navigator.maxTouchPoints > 0 && window.screen.width <= 1024);

      var canvas    = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");

      if (isMobile) {
        // Inject viewport meta
        var meta = document.createElement('meta');
        meta.name    = 'viewport';
        meta.content = 'width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover';
        document.head.appendChild(meta);

        // Switch container to mobile (fills screen via CSS above)
        container.className = "unity-mobile";
        canvas.className    = "unity-mobile";

        // Portrait lock — Android Chrome honours this; iOS ignores it
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('portrait').catch(function () {});
        }

        // Landscape overlay
        var overlay = document.getElementById('sdm-rotate-overlay');
        function checkOrientation() {
          var isLandscape = window.innerWidth > window.innerHeight;
          overlay.style.display = isLandscape ? 'flex' : 'none';
        }
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();

      } else {
        // Desktop: explicit pixel dimensions
        container.style.width  = "960px";
        container.style.height = "600px";
      }

      // ── Banner helper ─────────────────────────────────────────────────────
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === 'error') {
          div.style.cssText = 'background:red;padding:10px;';
        } else {
          if (type === 'warning') div.style.cssText = 'background:yellow;padding:10px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // ── Unity loader ──────────────────────────────────────────────────────
      var buildUrl   = "Build";
      var loaderUrl  = buildUrl + "/NatureInput_WebGL.loader.js";

      var config = {
        arguments:          [],
        dataUrl:            buildUrl + "/NatureInput_WebGL.data.unityweb",
        frameworkUrl:       buildUrl + "/NatureInput_WebGL.framework.js.unityweb",
        codeUrl:            buildUrl + "/NatureInput_WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName:        "DefaultCompany",
        productName:        "_source",
        productVersion:     "1.0",
        showBanner:         unityShowBanner,

        // Keep CSS size and render target in sync (Unity default, recommended).
        // Set to false only if you need manual render resolution control.
        // matchWebGLToCanvasSize: true,

        // Uncomment to force low-DPI rendering on mobile for better performance:
        // devicePixelRatio: 1,

        // Uncomment to auto-persist Application.persistentDataPath:
        // autoSyncPersistentDataPath: true,
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script  = document.createElement("script");
      script.src  = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-progress-bar-full").style.width =
            (100 * progress) + "%";
        })
        .then(function (unityInstance) {
          document.querySelector("#unity-loading-bar").style.display = "none";

          // Fullscreen button — desktop only (footer hidden on mobile via CSS)
          document.querySelector("#unity-fullscreen-button").onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        })
        .catch(function (message) {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
